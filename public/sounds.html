<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whirr Machine sounds</title>
<style>
:root{--bg:#14110f;--fg:#e8dfd0;--mut:#9a8f80;--card:#201b17;--line:#3a322a;--acc:#d9a441}
@media (prefers-color-scheme:light){:root{--bg:#f4efe6;--fg:#241d16;--mut:#6b6054;--card:#fffaf0;--line:#d8cdb8;--acc:#9a6a10}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:4px}
h3{font-size:13px;margin:14px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
p.n{color:var(--mut);margin:0 0 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0}
.row button{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);background:none;color:var(--acc);cursor:pointer;font-size:14px}
.row.playing button{background:var(--acc);color:var(--bg)}
.row .t{min-width:0;flex:1}.row b{display:block;font-weight:600;overflow-wrap:anywhere}.row small{color:var(--mut);display:block}
.row.missing{opacity:.5}.row.missing button{cursor:not-allowed}
.tag{flex:none;font-size:11px;color:var(--mut)}
</style></head><body>
<h1>Whirr Machine sound audition</h1>
<p class="n">One clip plays at a time. Faded rows are not generated yet. Tell me the ids to redo.</p>
<div id="root"></div>
<script>
var ITEMS=[{"id":"we-step","kind":"sfx","group":"engine","note":"One heavy footfall of a huge steam-driven iron walking machine: a deep metal clank of a massive foot plate hitting stone, a short hiss of venting steam and a faint grinding of gears","dur":1.2,"loop":false},{"id":"we-boiler-idle","kind":"sfx","group":"engine","note":"A steady low rumbling industrial boiler idling: deep furnace roar, faint bubbling water, rhythmic soft piston chuffing, seamless steady ambience","dur":4,"loop":true},{"id":"we-steam-vent","kind":"sfx","group":"engine","note":"A sudden burst of pressurised steam escaping a metal valve: sharp loud hiss that fades away, a small metallic rattle at the start","dur":1.5,"loop":false},{"id":"move-troops","kind":"sfx","group":"engine","note":"A small squad of armoured infantry advancing a few quick paces over gravel: boots crunching, leather straps creaking and metal kit rattling softly","dur":1.2,"loop":false},{"id":"melee-fist","kind":"sfx","group":"melee","note":"A huge iron fist smashing into a plate of thick armour: heavy dull metallic crunch with a deep low thud and a ringing tail","dur":1,"loop":false},{"id":"melee-blade","kind":"sfx","group":"melee","note":"A steel sword slash striking an iron plate: a quick bright metallic scrape and clang with a short ring","dur":0.8,"loop":false},{"id":"melee-axe","kind":"sfx","group":"melee","note":"A heavy axe chopping into thick metal armour: a deep wedge of steel biting iron, a heavy clang and a crunch","dur":0.9,"loop":false},{"id":"melee-knife","kind":"sfx","group":"melee","note":"A short fast knife stab into leather and metal: a quick sharp slice and a small tink","dur":0.6,"loop":false},{"id":"melee-club","kind":"sfx","group":"melee","note":"A gun stock swung into a body in heavy armour: a hard wooden and metallic thump with a grunt of impact","dur":0.7,"loop":false},{"id":"melee-shield","kind":"sfx","group":"melee","note":"A heavy steel shield bashed against an iron wall: a booming flat metallic slam with a long ringing reverb","dur":0.9,"loop":false},{"id":"hit-trooper","kind":"sfx","group":"melee","note":"A short dull impact of a bullet hitting a soldier in cloth and leather armour, a muffled thud","dur":0.5,"loop":false},{"id":"attack-miss","kind":"sfx","group":"melee","note":"A fast airy whoosh of a heavy weapon swung through empty air, quick and dry","dur":0.5,"loop":false},{"id":"pa-slam","kind":"sfx","group":"power","note":"A heavy body slammed into an iron wall: a crashing metal collision, a clattering skid across stone and a settling rattle","dur":1.5,"loop":false},{"id":"pa-throw","kind":"sfx","group":"power","note":"A burst of hydraulic piston strain and a short grinding groan of gears, then a heavy crash as a large object lands on stone and rolls","dur":1.5,"loop":false},{"id":"pa-headbutt","kind":"sfx","group":"power","note":"A dull heavy iron clang like a thick steel helmet striking an iron plate, one deep bonk with a short ring","dur":0.8,"loop":false},{"id":"pa-trample","kind":"sfx","group":"power","note":"Rapid heavy iron stomps with crunching and snapping debris underfoot, five fast footfalls of a huge machine","dur":1.5,"loop":false},{"id":"gun-magelock-pistol","kind":"sfx","group":"gun","note":"A single sharp pistol shot: a crisp loud crack with a short snap of a flintlock-like mechanism, dry and punchy, a faint sizzle of arcane sparks","dur":0.6,"loop":false},{"id":"gun-dual-pistol","kind":"sfx","group":"gun","note":"Two sharp pistol shots fired almost together, a quick double crack, dry and punchy","dur":0.8,"loop":false},{"id":"gun-spellstorm-pistol","kind":"sfx","group":"gun","note":"A rapid stuttering burst of electrically charged pistol shots, each a crack with a bright crackling zap tail","dur":0.9,"loop":false},{"id":"gun-spellstorm-cannon","kind":"sfx","group":"gun","note":"A rapid heavy burst of a large charged cannon: deep thudding booms each followed by a crackling electrical zap","dur":1.2,"loop":false},{"id":"gun-magelock-rifle","kind":"sfx","group":"gun","note":"A single long-barrel rifle shot: a sharp loud crack with a long rolling echo, dry and precise","dur":1,"loop":false},{"id":"gun-scattergun","kind":"sfx","group":"gun","note":"A single wide shotgun blast: a loud booming report with a spray of pellets whistling and rattling against metal","dur":0.9,"loop":false},{"id":"gun-cannon","kind":"sfx","group":"gun","note":"A single large artillery cannon firing a heavy shell: a huge deep boom with a shockwave, rumbling echo and a metallic recoil clank","dur":1.5,"loop":false},{"id":"gun-cannon-blast","kind":"sfx","group":"gun","note":"A deep heavy cannon thump followed by a loud explosive burst of a shell detonating with rumbling debris","dur":1.5,"loop":false},{"id":"gun-slug-cannon","kind":"sfx","group":"gun","note":"A large heavy slug gun firing one solid metal slug: a massive flat bang with a hard mechanical clunk of the breech","dur":1.2,"loop":false},{"id":"gun-grenade-launcher","kind":"sfx","group":"gun","note":"A hollow thump of a grenade being lobbed from a tube, a short whistling arc then a muffled distant explosion","dur":1.5,"loop":false},{"id":"gun-jack-buster","kind":"sfx","group":"gun","note":"A rocket launch: a hard whooshing ignition roar of a rocket leaving a tube trailing a hissing flame, ending in a sharp metallic crunch","dur":1.5,"loop":false},{"id":"gun-carbine","kind":"sfx","group":"gun","note":"A single sharp suppressed carbine shot: a tight muffled crack with a soft mechanical bolt cycle, dry","dur":0.6,"loop":false},{"id":"gun-assault-cannon","kind":"sfx","group":"gun","note":"A fast heavy rattling burst of a large automatic cannon: rhythmic deep booms with metal casings clattering","dur":1.4,"loop":false},{"id":"gun-thrown-axe","kind":"sfx","group":"gun","note":"A heavy axe thrown spinning through the air with a whirring whoosh and a chunk as it buries in wood and metal","dur":0.9,"loop":false},{"id":"spell-arcane-bolt","kind":"sfx","group":"spell","note":"A crackling bolt of arcane energy: a rising electric charge, a sharp zap release and a shimmering resonant tail","dur":1,"loop":false},{"id":"spell-frost","kind":"sfx","group":"spell","note":"A freezing burst: a sharp crystalline crack of ice forming, tinkling shards and a cold airy rush","dur":1.2,"loop":false},{"id":"spell-lightning","kind":"sfx","group":"spell","note":"A branching lightning arc jumping between metal objects: a crackling electric snap with a sizzling buzz and a low thunder tail","dur":1.2,"loop":false},{"id":"focus-allocate","kind":"sfx","group":"ui","note":"A short bright magical chime with a soft glassy shimmer, two rising notes, gentle and clean","dur":0.8,"loop":false},{"id":"boost-whine","kind":"sfx","group":"ui","note":"A rising mechanical energy whine of a capacitor charging up, pitch climbing quickly then a short snap at the top","dur":1,"loop":false},{"id":"sys-crippled","kind":"sfx","group":"damage","note":"A machine system failing: electrical sparks popping, a grinding gear that stutters and a metallic screech ending in a clunk","dur":1.5,"loop":false},{"id":"we-wreck","kind":"sfx","group":"damage","note":"A huge steam boiler rupturing: an explosive burst, a long roaring hiss of steam and a collapsing crash of heavy iron plates falling and settling","dur":3,"loop":false},{"id":"death-cyg","kind":"sfx","group":"death","note":"A soldier hit and falling in armour: a short pained grunt, a stagger and a heavy collapse with equipment clattering on stone, no words","dur":1.8,"loop":false},{"id":"death-kha","kind":"sfx","group":"death","note":"A burly soldier in heavy armour taking a hit: a deep gruff groan, a dull thud and a heavy fall with metal gear rattling, no words","dur":2,"loop":false},{"id":"death-caster","kind":"sfx","group":"death","note":"A dramatic fall of a leader: a short strained gasp, a heavy body falling and a low sinking arcane resonance fading out, no words","dur":3,"loop":false},{"id":"tough-save","kind":"sfx","group":"death","note":"A tough soldier shrugging off a hit: a short grunt of effort and a staggering boot scuff on stone, no words","dur":1,"loop":false},{"id":"cloud-hiss","kind":"sfx","group":"env","note":"A low steady hiss of a spreading cloud of smoke or gas, soft and airy","dur":2,"loop":false},{"id":"fire-crackle","kind":"sfx","group":"env","note":"Burning wood and tar crackling and popping, a low flickering flame roar","dur":2,"loop":false},{"id":"corrosion-sizzle","kind":"sfx","group":"env","note":"Acid eating into metal: bubbling, fizzing and a sharp hissing sizzle","dur":1.8,"loop":false},{"id":"dice-2d6","kind":"sfx","group":"ui","note":"Two six-sided wooden dice shaken and rolled across a wooden table: a clatter then a few tumbling taps settling","dur":1.3,"loop":false},{"id":"dice-3d6","kind":"sfx","group":"ui","note":"Three six-sided wooden dice shaken and rolled across a wooden table: a busy clatter then tumbling taps settling","dur":1.5,"loop":false},{"id":"ui-click","kind":"sfx","group":"ui","note":"A single short crisp mechanical button click, dry and small","dur":0.5,"loop":false},{"id":"turn-bell","kind":"sfx","group":"ui","note":"A single struck brass bell, clear metallic ring with a medium decay, one strike","dur":1.5,"loop":false},{"id":"vo-round-start","kind":"voice","group":"voice","note":"A new round begins.","loop":false},{"id":"vo-your-turn","kind":"voice","group":"voice","note":"Your turn. Take command.","loop":false},{"id":"vo-enemy-turn","kind":"voice","group":"voice","note":"The enemy moves.","loop":false},{"id":"vo-control-phase","kind":"voice","group":"voice","note":"Control phase. Check the objectives.","loop":false},{"id":"vo-boost","kind":"voice","group":"voice","note":"Boost!","loop":false},{"id":"vo-critical","kind":"voice","group":"voice","note":"Critical!","loop":false},{"id":"vo-assassination","kind":"voice","group":"voice","note":"Assassination!","loop":false},{"id":"vo-scenario-scored","kind":"voice","group":"voice","note":"The scenario is scored.","loop":false},{"id":"vo-victory","kind":"voice","group":"voice","note":"Victory is yours. Well fought.","loop":false},{"id":"vo-defeat","kind":"voice","group":"voice","note":"Defeat. The field is lost.","loop":false},{"id":"music-title-a","kind":"music","group":"music","note":"Title theme, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, slow ominous and grand, steady tempo, loops seamlessly","dur":75,"loop":true},{"id":"music-battle-a-a","kind":"music","group":"music","note":"Battle loop, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, low-to-medium intensity, steady driving rhythm with space for sound effects on top, steady dynamics, loops seamlessly","dur":150,"loop":true},{"id":"music-battle-b-a","kind":"music","group":"music","note":"Battle loop, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, brooding and tense, low-to-medium intensity, slower pulse, steady dynamics so effects stand out, loops seamlessly","dur":150,"loop":true},{"id":"music-victory-a","kind":"music","group":"music","note":"Short victory stinger, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, triumphant brass fanfare with a final anvil strike, ends cleanly","dur":12,"loop":false},{"id":"music-defeat-a","kind":"music","group":"music","note":"Short defeat stinger, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, mournful low brass and strings falling away, a final dull anvil toll, ends cleanly","dur":12,"loop":false},{"id":"music-title-b","kind":"music","group":"music","note":"Title theme, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, slow ominous and grand, steady tempo, loops seamlessly","dur":75,"loop":true},{"id":"music-battle-a-b","kind":"music","group":"music","note":"Battle loop, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, low-to-medium intensity, steady driving rhythm with space for sound effects on top, steady dynamics, loops seamlessly","dur":150,"loop":true},{"id":"music-battle-b-b","kind":"music","group":"music","note":"Battle loop, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, brooding and tense, low-to-medium intensity, slower pulse, steady dynamics so effects stand out, loops seamlessly","dur":150,"loop":true},{"id":"music-victory-b","kind":"music","group":"music","note":"Short victory stinger, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, triumphant brass fanfare with a final anvil strike, ends cleanly","dur":12,"loop":false},{"id":"music-defeat-b","kind":"music","group":"music","note":"Short defeat stinger, industrial-orchestral steampunk, heavy brass, low strings, anvil and taiko percussion, a rhythmic mechanical machine pulse, no vocals, no choir, mournful low brass and strings falling away, a final dull anvil toll, ends cleanly","dur":12,"loop":false}];
// Relative to this page, so it works under /whirr-machine/ on Pages and at / in dev.
var cur=null,curRow=null;
function path(i){return i.kind==='music'?'audio/music/'+i.id+'.mp3':'audio/'+i.id+'.mp3'}
function stop(){if(cur){cur.pause();cur.currentTime=0}if(curRow)curRow.classList.remove('playing');cur=null;curRow=null}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
var root=document.getElementById('root');
[['sfx','Sound effects'],['voice','Narrator voice'],['music','Music']].forEach(function(s){
  var h=el('h2','',s[1]);root.appendChild(h);var last='';
  ITEMS.filter(function(i){return i.kind===s[0]}).forEach(function(i){
    if(s[0]==='sfx'&&i.group!==last){root.appendChild(el('h3','',i.group));last=i.group}
    var row=el('div','row'),b=el('button','','▶'),t=el('div','t'),n=el('b','',i.id),d=el('small','',i.note);
    t.appendChild(n);t.appendChild(d);row.appendChild(b);row.appendChild(t);
    if(i.dur)row.appendChild(el('span','tag',i.dur+' s'+(i.loop?' loop':'')));
    var a=new Audio();a.preload='none';a.loop=false;a.src=path(i);
    a.onerror=function(){row.classList.add('missing');if(cur===a)stop()};
    a.onended=function(){if(cur===a)stop()};
    b.onclick=function(){if(cur===a){stop();return}stop();cur=a;curRow=row;row.classList.add('playing');a.currentTime=0;a.play().catch(function(){row.classList.add('missing');stop()})};
    root.appendChild(row);
  });
});
</script></body></html>
